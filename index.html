<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant Bloom — AI plant care</title>
<meta name="description" content="Plant Bloom — point, scan, and we'll do the rest. AI plant identification, health diagnosis, and personalized care.">
<link rel="icon" href="assets/logo-mark.svg">

<!-- ================= Design system tokens (inlined for zero-config running) ================= -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --green-950:#0E1C14;--green-900:#14271C;--green-800:#1D3829;--green-700:#274C37;--green-600:#356048;--green-500:#4C8662;--green-400:#6FA886;--green-300:#9CC6AE;--green-200:#C8E0D2;--green-100:#E6F0E9;--green-50:#F1F7F3;
  --bloom-700:#A8542F;--bloom-600:#C2683E;--bloom-500:#D6885E;--bloom-400:#E4A480;--bloom-300:#EFC2A6;--bloom-200:#F6DCC9;--bloom-100:#FBEDE2;
  --bone-50:#FBF9F3;--bone-100:#F5F1E7;--bone-200:#EAE4D5;--bone-300:#D9D1BF;--bone-400:#BDB39C;
  --ink-900:#1A1F1A;--ink-800:#272D26;--ink-700:#3A423A;--ink-600:#545C53;--ink-500:#6E766C;--ink-400:#8C9388;
  --white:#FFFFFF;--warm-white:#FFFEFB;
  --status-healthy:#4C8662;--status-attention:#D6885E;--status-critical:#B4452F;--status-info:#3F6E8C;
  --surface-page:var(--bone-50);--surface-card:var(--warm-white);--surface-sunken:var(--bone-100);--surface-inverse:var(--green-900);--surface-accent-soft:var(--green-100);--surface-bloom-soft:var(--bloom-100);
  --text-primary:var(--ink-900);--text-secondary:var(--ink-500);--text-muted:var(--ink-400);--text-on-dark:var(--bone-50);--text-on-dark-muted:var(--green-300);--text-accent:var(--green-700);--text-bloom:var(--bloom-700);
  --primary:var(--green-600);--primary-strong:var(--green-700);--primary-soft:var(--green-100);--on-primary:var(--bone-50);
  --accent:var(--bloom-500);--accent-strong:var(--bloom-600);--on-accent:var(--warm-white);
  --border-subtle:var(--bone-200);--border-default:var(--bone-300);--border-strong:var(--ink-400);--border-focus:var(--green-500);
  --ring-focus:color-mix(in oklch, var(--green-500) 45%, transparent);
  --font-display:'Spectral',Georgia,'Times New Roman',serif;--font-sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono','SF Mono',Menlo,monospace;
  --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
  --text-2xs:11px;--text-xs:12px;--text-sm:13px;--text-base:15px;--text-md:17px;--text-lg:20px;--text-xl:24px;--text-2xl:30px;--text-3xl:38px;--text-4xl:48px;--text-5xl:62px;--text-6xl:80px;
  --leading-tight:1.08;--leading-snug:1.22;--leading-normal:1.5;--leading-relaxed:1.65;
  --tracking-tight:-0.02em;--tracking-snug:-0.011em;--tracking-normal:0em;--tracking-wide:0.04em;--tracking-caps:0.14em;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;
  --radius-xs:6px;--radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--radius-2xl:36px;--radius-pill:999px;--radius-circle:50%;
  --shadow-xs:0 1px 2px rgba(26,31,26,0.05);--shadow-sm:0 2px 8px rgba(26,31,26,0.06);--shadow-md:0 6px 20px rgba(26,31,26,0.08);--shadow-lg:0 16px 40px rgba(26,31,26,0.10);--shadow-xl:0 28px 70px rgba(26,31,26,0.14);--shadow-bloom:0 10px 30px rgba(166,84,47,0.18);--shadow-inset:inset 0 1px 2px rgba(26,31,26,0.05);
  --ease-organic:cubic-bezier(0.22,1,0.36,1);--ease-soft:cubic-bezier(0.4,0,0.2,1);--ease-bounce:cubic-bezier(0.34,1.56,0.64,1);
  --dur-fast:140ms;--dur-base:240ms;--dur-slow:420ms;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--font-sans);font-size:var(--text-base);line-height:var(--leading-normal);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--weight-medium);line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);margin:0;color:var(--text-primary);}
p{margin:0;text-wrap:pretty;}
a{color:var(--text-accent);text-decoration:none;}
.pb-overline{font-family:var(--font-sans);font-weight:var(--weight-semibold);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-secondary);display:inline-flex;align-items:center;}

#app{height:100vh;display:flex;overflow:hidden;background:var(--surface-page);}
.pb-main{flex:1;height:100%;overflow-y:auto;}
@keyframes pbScan{0%{top:6%;}50%{top:92%;}100%{top:6%;}}
@keyframes pbFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.pb-view{animation:pbFade 360ms var(--ease-organic);}
::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-thumb{background:var(--bone-300);border-radius:99px;border:3px solid var(--surface-page);}
button{font-family:var(--font-sans);}
input::placeholder{color:var(--text-muted);}

/* responsive: collapse sidebar to a top bar on small screens */
@media (max-width:880px){
  #app{flex-direction:column;}
  .pb-sidebar{width:100%!important;height:auto!important;flex-direction:row!important;align-items:center;flex-wrap:wrap;padding:12px 16px!important;border-right:none!important;border-bottom:1px solid var(--border-subtle);}
  .pb-sidebar .pb-navwrap{flex-direction:row!important;margin-top:0!important;gap:4px!important;}
  .pb-sidebar .pb-foot{margin-top:0!important;margin-left:auto;border:none!important;}
  .pb-sidebar .pb-scanbtn,.pb-sidebar .pb-foot .pb-settings{margin-top:0!important;}
  .pb-grid-2,.pb-grid-3{grid-template-columns:1fr!important;}
  .pb-split{grid-template-columns:1fr!important;}
  .pb-hero{grid-template-columns:1fr!important;}
}
@media (prefers-reduced-motion:reduce){
  .pb-view{animation:none;}
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<script type="application/json" id="pb-source-note">
  The application source lives in src/app.jsx and is precompiled to app.js
  (Babel, classic JSX runtime). Rebuild with: node build.mjs
</script>
<script src="app.js"></script>
</body>
</html>
